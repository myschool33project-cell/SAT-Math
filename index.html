<style>
:root{--bg:#f4f7fd;--card:#fff;--tx:#16233f;--mu:#667189;--ac:#1f3a68;--on:#fff;--sb:#fff;--soft:#dfe8ff;--hero:linear-gradient(120deg,#dbe5ff,#c6d6ff);--go:#f5a912;--ok:#2e8b57;--bad:#c0392b;--bd:#e5e9f2;--sh:0 2px 12px rgba(20,37,72,.07);color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e121a;--card:#171d29;--tx:#e8ecf3;--mu:#97a1b3;--ac:#8fb0ff;--on:#0e121a;--sb:#111723;--soft:#22304f;--hero:linear-gradient(120deg,#1b2a52,#243a73);--bd:#283042;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e121a;--card:#171d29;--tx:#e8ecf3;--mu:#97a1b3;--ac:#8fb0ff;--on:#0e121a;--sb:#111723;--soft:#22304f;--hero:linear-gradient(120deg,#1b2a52,#243a73);--bd:#283042;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:flex-end;gap:10px;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 18px 0;background:var(--bg)}
.hb{display:none;font-weight:700;font-size:19px;color:var(--ac);margin-right:auto}
.ib{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);height:40px;padding:0 12px;border-radius:12px;font-size:15px;cursor:pointer}
#mb{display:none;border:0;font-size:22px;padding:0 6px;background:none}
.fl{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.tg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px}
.tg button{border:0;background:none;color:var(--mu);width:36px;height:32px;border-radius:16px;font-size:16px;cursor:pointer}.tg button.on{background:#1b2a52;color:#ffd166}
.av.ph{width:auto;min-width:40px;max-width:88px;padding:0;background:none;border-radius:10px;overflow:hidden;display:flex;align-items:center}.av.ph img{height:40px;width:auto;max-width:88px;object-fit:contain;display:block}.av{width:40px;height:40px;border-radius:50%;border:0;background:#1b2a52;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.lw{position:relative}.lmenu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:170px;z-index:40}
.lmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:8px;font-size:15px;cursor:pointer}.lmenu button:hover{background:var(--bg)}
.bk{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.3)}.bk.t{background:none;z-index:35}
.wrap{display:flex;margin-top:calc(-64px - env(safe-area-inset-top,0px))}
aside{width:250px;flex:none;background:var(--sb);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;padding:26px 16px;display:flex;flex-direction:column;z-index:31}

const GLOGO='<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
function gSign(){if(!AU)return;gerr="";const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});AU.signInWithPopup(pr).catch(x=>{const c=x&&x.code;if(c=="auth/popup-blocked"||c=="auth/operation-not-supported-in-this-environment")AU.signInWithRedirect(pr);else if(c!="auth/popup-closed-by-user"&&c!="auth/cancelled-popup-request"){gerr=String(x.message||x);draw()}})}
function gateV(){const n=new Date().getFullYear(),op=(a,b,v,l)=>{let r=`<option value="">${l}</option>`;for(let i=a;i<=b;i++)r+=`<option value="${i}"${v==i?" selected":""}>${i}</option>`;return r},ys=(()=>{let r=`<option value="">${t("g9")}</option>`;for(let i=n-5;i>=1940;i--)r+=`<option value="${i}"${G.y==i?" selected":""}>${i}</option>`;return r})();
const er2=gerr?`<p style="color:var(--bad)">${e(gerr)}</p>`:"";
$("app").innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))"><div class="card" style="width:100%;max-width:420px;margin:0"><div class="bl"><img src="${LG}" alt=""></div>`+(cfgErr?`<h2 style="text-align:center">Setup needed</h2><p class="mu">Paste your Firebase config at the top of the script (const FB).</p>`:!ME?`<h2 style="text-align:center">${t("g1")}</h2><p class="mu" style="text-align:center">${t("g2")}</p>${er2}<button class="btn g" style="width:100%;display:flex;justify-content:center;align-items:center;gap:10px;background:#fff;color:#3c4043" onclick="gSign()">${GLOGO} ${t("gsi")}</button>`:`<h2 style="text-align:center">${t("g4")}</h2><p class="mu" style="text-align:center;word-break:break-all">${t("g12")}: ${e(EM)}</p><input id="gn" placeholder="${t("g5")}" value="${e(G.n||MN)}" autocomplete="name"><label class="mu">${t("g6")}</label><div class="row" style="flex-wrap:nowrap"><select id="gd">${op(1,31,G.d,t("g7"))}</select><select id="gm">${op(1,12,G.m,t("g8"))}</select><select id="gy">${ys}</select></div>${er2}<button class="btn" style="width:100%" onclick="gDone()">${t("g10")}</button><button class="btn g" style="width:100%;margin-top:8px" onclick="logout()">${t("lo")}</button>`)+`</div></div>`}
function gDone(){G={n:$("gn").value.trim(),d:$("gd").value,m:$("gm").value,y:$("gy").value};const dt=new Date(+G.y,+G.m-1,+G.d);if(!G.n||!G.d||!G.m||!G.y||dt.getDate()!=+G.d||dt.getMonth()!=+G.m-1){gerr=t("g11");draw();return}gerr="";delete U.out;U.prof={name:G.n.slice(0,60),dob:G.y+"-"+String(G.m).padStart(2,"0")+"-"+String(G.d).padStart(2,"0"),uid:ME||""};save();if(DB&&ME)DB.doc("data/users/"+ME+"/profile").set({pic:PIC,prof:U.prof}).catch(()=>{});view="home";sync();draw()}
async function addC(){const n=$("cnm").value.trim(),k=$("ccd").value.trim();if(!n||!k){er=t("bad2");draw(1);return}er="";try{const r=await DB.collection("communities").add({name:n.slice(0,60),desc:$("cds").value.trim().slice(0,160),t:Date.now(),h:hx(k)});try{await DB.doc("codes/"+r.id).set({code:k})}catch(x){er=String(x.message||x.code||x)}}catch(x){er=String(x.message||x.code||x)}draw(1)}
async function delC(id){if(!confirm("?"))return;try{await DB.doc("communities/"+id).delete();await DB.doc("codes/"+id).delete()}catch(x){}}
async function joinC(c){const C=comms.find(x=>x.id==c),k=$("j"+c).value.trim();if(!k)return;if(await hx(k)!==C.h){bw=c;draw(1);return}bw=null;try{await DB.doc("approved/"+c+"_"+ME).set({cid:c,uid:ME,t:Date.now()})}catch(x){}draw(1)}
function PC(){return`<div class="card row" style="gap:16px">${PIC?`<img src="${PIC}" style="max-width:140px;max-height:140px;width:auto;height:auto;border-radius:12px;object-fit:contain;display:block" alt="">`:`<div class="av" style="width:84px;height:84px;font-size:34px;display:grid;place-items:center">${DN()?e(DN()[0].toUpperCase()):"👤"}</div>`}<div style="flex:1;min-width:0"><h2 style="margin:0">${e(DN()||t("mem"))}</h2><div class="mu">${t("gacc")}: ${e(EM||"—")}</div>${U.prof&&U.prof.dob?`<div class="mu">${t("g6")}: ${e(U.prof.dob.split("-").reverse().join("."))}</div>`:""}<label class="btn g" style="display:inline-block;margin-top:8px">📷 ${t("chp")}<input type="file" accept="image/*" hidden onchange="setPic(this)"></label> <button class="btn d" style="margin-top:8px;border:1px solid var(--bad)" onclick="logout()">⎋ ${t("lo")}</button></div></div>`}
function logout(){admin=false;delete U.prof;delete U.first;delete U.pic;PIC="";G={n:"",d:"",m:"",y:""};gerr="";oc=null;cur=null;rvw=null;sv=null;view="home";S.results=[];save();if(AU)AU.signOut();else draw()}
function setPic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);PIC=c.toDataURL(f.type=="image/png"?"image/png":"image/jpeg",.85);U.pic=PIC;save();if(DB&&ME)try{await DB.doc("data/users/"+ME+"/profile").set({pic:PIC,prof:U.prof||{}});sync()}catch(x){}draw(1)};im.src=r.result};r.readAsDataURL(f)}
async function addP(){const tx=$("ct").value.trim();if(!tx)return;try{await DB.collection("posts").add({cid:oc,uid:ME,text:tx.slice(0,1000),t:Date.now(),likes:[],replies:[]})}catch(x){}draw(1)}
async function like(id){const p=posts.find(x=>x.id==id),l=p.likes||[];try{await DB.doc("posts/"+id).update({likes:l.includes(ME)?l.filter(x=>x!=ME):[...l,ME]})}catch(x){}}
async function repl(id){const i=$("r"+id),tx=i.value.trim();if(!tx)return;const p=posts.find(x=>x.id==id);try{await DB.doc("posts/"+id).update({replies:[...(p.replies||[]),{uid:ME,text:tx.slice(0,500),t:Date.now()}]})}catch(x){}}
async function delP(id){try{await DB.doc("posts/"+id).delete()}catch(x){}}
function homeEd(){if(!DB)return"";return`<div class="card"><h3>${t("hed")}</h3><input id="hq" placeholder="${t("mq")}" value="${e(H["quote_"+U.lang]||"")}"><textarea id="hi" placeholder="${t("intro")}">${e(H["intro_"+U.lang]||"")}</textarea><textarea id="hcd" placeholder="${t("codeph")}" style="font-family:monospace">${e(H.code||"")}</textarea><input id="hch" type="number" placeholder="${t("codeh")}" value="${H.codeh||""}"><div class="row"><button class="btn" onclick="saveH()">${t("save")}</button><span class="mu">${msg}</span><label class="btn g">📷 ${t("addimg")}<input type="file" accept="image/*" hidden onchange="upImg(this)"></label></div>`+(H.imgs||[]).map((u,i)=>`<div class="row sp" style="margin-top:6px"><img src="${e(u)}" style="height:46px;border-radius:8px" alt=""><button class="btn d" onclick="delImg(${i})">✕</button></div>`).join("")+`</div>`}
async function putH(){try{await DB.doc("site/home").set(Object.assign({},H))}catch(x){}draw(1)}
const LN={en:"English",uz:"Uzbek",ru:"Russian",kk:"Kazakh"};
async function aiT(x,f){return null}
async function fixW(){msg=t("auto")+"…";draw(1);for(const w of S.words){if(w.uz&&w.ru&&w.kk)continue;const r=await aiT(w.en,"English");if(r){w.uz=w.uz||r.uz;w.ru=w.ru||r.ru;w.kk=w.kk||r.kk}}msg="";save();draw()}
async function saveH(){const l=U.lang;H["intro_"+l]=$("hi").value;H["quote_"+l]=$("hq").value.trim();H.code=$("hcd").value;H.codeh=+$("hch").value||320;msg=t("auto")+"…";draw(1);for(const k of["intro","quote"]){const v=H[k+"_"+l];if(!v)continue;const r=await aiT(v,LN[l]);if(r)["en","uz","ru","kk"].forEach(c=>{if(c!=l&&r[c])H[k+"_"+c]=r[c]})}msg="";putH()}
const rsz=(f,m)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(async b=>{r(c.toDataURL("image/jpeg",.6))},"image/jpeg",.8)};i.src=fr.result};fr.readAsDataURL(f)});
async function qImg(i){if(!i.files[0])return;QI=await rsz(i.files[0],700);const p=$("qp");p.src=QI;p.style.display="inline"}
async function upImg(i){const f=i.files[0];if(!f)return;H.imgs=[...(H.imgs||[]),await rsz(f,800)];await putH()}
function delImg(i){H.imgs.splice(i,1);putH()}
draw();
